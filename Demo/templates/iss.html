<!DOCTYPE html>
<html>
<head>
    <title>Solar 3D & Fibonacci</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">  
</head>
<body>
    <div class = "Title">
        <h1>Asteria Space</h1>
        <h1>Центр відслідковування за ISS</h1>
    </div>
    <div class="container">
        <div class="card">
            <h3> Поточне місце</h3>
            <p>Широта:  <span id="lat" class="val">...</span></p>
            <p>Довгота: <span id="lon" class="val">...</span></p>
        </div>
        <div class="card">
            <h3>Екіпаж на борту</h3>
            <p>Зараз у космосі:</p>
            <span id="count" class="val">...</span>
        </div>
    </div>

    <script>
        function fetchIssData(signal, callback) {
            const timeoutId = setTimeout(() => {
                controller.abort();
                callback(new Error("TimeoutError"), null);
            }, 5000);
            const controller = new AbortController();
            const cleanup = () => {
                clearTimeout(timeoutId);
                signal.removeEventListener('abort', onAbort);
            };
            const onAbort = () => {
                cleanup();
                controller.abort();
                callback(new Error("AbortError"), null);
            };
            signal.addEventListener('abort', onAbort);
            fetch('/api/iss-live', { signal: controller.signal })
            .then(res => res.json())
            .then(data => {
                cleanup();
                if (!signal.aborted) callback(null, data);
            })
            .catch(err => {
                cleanup();
                if (err.name === 'AbortError') return;
                callback(err, null);
            });
        }
        const mainSignal = new AbortController();
        async function updateData() {
            fetchIssData(mainSignal.signal, (err, data) => {
                if (err) {
                    console.error("Роботу зупинено або помилка:", err.message);
                return;
            }
            document.getElementById('lat').textContent = data.location.iss_position.latitude;
            document.getElementById('lon').textContent = data.location.iss_position.longitude;
            document.getElementById('count').textContent = data.crew.number;
            });       
            }
            updateData();
            let issTimer = setInterval(updateData, 2000); 
            window.addEventListener('beforeunload', () => {
            clearInterval(issTimer); 
            mainSignal.abort();
        });
    </script>

</body>
</html>
